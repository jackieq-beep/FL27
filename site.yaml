# Site-wide settings. Edit these values and the site rebuilds automatically.

name: Football League 2026
short_name: FL2026
# Year shown next to the logo in the official numeral style (2025, 2026 or 2027). Leave empty to hide.
brand_year: 2027
company: Mobile Soccer
contact_email: partnerships@mobilesoccer.net
legal_email: support@footballleaguegame.com

# Google Analytics 4 "Measurement ID" (looks like G-XXXXXXXXXX). Leave empty to switch analytics off.
# Analytics only runs after a visitor clicks "Accept all" in the cookie banner.
ga_measurement_id: ""

# Where the site lives. Leave base_path empty once a custom domain is set up.
site_url: https://jackieq-beep.github.io
base_path: /FL27

stores:
  google_play: https://play.google.com/store/apps/details?id=com.football.soccer.league
  app_store: https://apps.apple.com/us/app/football-league-2025/id6447961802

# Your Spreadshop. It is embedded on the Shop page of this site.
spreadshop:
  name: football-league-fan-shop
  url: https://football-league-fan-shop.myspreadshop.com

# Category tiles on the Shop page. "slug" is the Spreadshop category address.
# "products" are product photos straight from your Spreadshop (image.spreadshirtmedia.com):
# copy a product image address from the shop and keep everything before the "?".
# "color" (appearanceId) picks the product color; leave it out for the default.
shop_categories:
  - key: men
    slug: men
    products:
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T210A1PA4301PT17X41Y37D1058835926W25000H25000/views/1/Football%20League%20Crest.png" }   # Men's T-Shirt
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T111A1PA4247PT17X70Y22D1058835926W20844H20844/views/1/Football%20League%20Crest.png" }   # Men's Hoodie
  - key: women
    slug: women
    products:
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T405A1PA4081PT17X57Y21D1058835926W19538H19538/views/1/Football%20League%20Crest.png" }   # Women's Hoodie
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T491A1123PA4308PT17X40Y37D1058835926W25000H25000/views/1/Football%20League%20Crest.png", color: 1123 }   # Tie Dye T-Shirt
  - key: kids
    slug: "kids+%26+babies"
    products:
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T48A1PA4545PT17X37Y31D1058835926W17341H17341/views/1/Football%20League%20Crest.png" }    # Kid's T-Shirt
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T877A1PA5115PT17X17Y21D1058835926W8000H8000/views/1/Football%20League%20Crest.png" }     # Toddler Long Sleeve
  - key: accessories
    slug: accessories
    products:
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T842A1PA3667PT17X38Y31D1058835926W17574H17574/views/1/Football%20League%20Crest.png" }   # Tote Bag
      - { img: "https://image.spreadshirtmedia.com/image-server/v1/products/T4554A1PA5179PT10X10Y5D1058835926W4895H4895/views/3/Football%20League%20Crest.png" }     # Tennis Socks

# Background colour painted behind the product photos (no #). Matches the tiles.
shop_photo_bg: "16161a"

# Category bar above the shop (matches the categories in your Spreadshop).
shop_nav:
  - { key: all, slug: all }
  - key: men
    slug: men
    sub:
      - { key: tshirts, slug: men/t-shirts }
      - { key: hoodies, slug: "men/hoodies+%26+sweatshirts" }
      - { key: zips, slug: "men/zip+hoodies+%26+jackets" }
      - { key: longsleeve, slug: "men/long+sleeve+shirts" }
      - { key: polos, slug: "men/polo+shirts" }
      - { key: tanks, slug: "men/tank+tops" }
      - { key: sportswear, slug: men/sportswear }
      - { key: bottoms, slug: men/bottoms }
  - key: women
    slug: women
    sub:
      - { key: tshirts, slug: women/t-shirts }
      - { key: hoodies, slug: "women/hoodies+%26+sweatshirts" }
      - { key: zips, slug: "women/zip+hoodies+%26+jackets" }
      - { key: longsleeve, slug: "women/long+sleeve+shirts" }
      - { key: polos, slug: "women/polo+shirts" }
      - { key: tanks, slug: women/tanks }
      - { key: sportswear, slug: women/sportswear }
      - { key: bottoms, slug: women/bottoms }
  - key: kids
    slug: "kids+%26+babies"
    sub:
      - { key: kidshirts, slug: "kids+%26+babies/kids'+shirts" }
      - { key: hoodies, slug: "kids+%26+babies/hoodies+%26+sweatshirts" }
      - { key: longsleeve, slug: "kids+%26+babies/long+sleeve+shirts" }
      - { key: baby, slug: "kids+%26+babies/baby+products" }
      - { key: accessories, slug: "kids+%26+babies/accessories" }
  - key: accessories
    slug: accessories
    sub:
      - { key: caps, slug: "accessories/caps+%26+hats" }
      - { key: bags, slug: "accessories/bags+%26+backpacks" }
      - { key: aprons, slug: accessories/aprons }
      - { key: socks, slug: accessories/socks }
  - { key: home, slug: "home+%26+living" }
  - { key: stickers, slug: stickers }

# Leave empty so Shop buttons open the Shop page on this site.
shop_url: ""

# A YouTube link to the trailer. When set, a "Watch Trailer" button appears on the home page.
trailer_url: ""

# Only filled-in links are shown.
social:
  discord: https://discord.gg/m825ft9xGn
  instagram: https://www.instagram.com/fl2024official/
  facebook: https://www.facebook.com/playfootballleague/
  youtube: ""
  x: ""
  tiktok: https://www.tiktok.com/@footballleague.official

# Languages. Set enabled: true once a language's file in i18n/ is translated.
languages:
  - { code: en, label: English, short: EN, dir: ltr, enabled: true }
  - { code: zh-cn, label: 简体中文, short: 中文, dir: ltr, enabled: false }
  - { code: es, label: Español, short: ES, dir: ltr, enabled: false }
  - { code: pt, label: Português, short: PT, dir: ltr, enabled: false }
  - { code: id, label: Bahasa Indonesia, short: ID, dir: ltr, enabled: false }
  - { code: fr, label: Français, short: FR, dir: ltr, enabled: false }
  - { code: ar, label: العربية, short: AR, dir: rtl, enabled: false }
  - { code: ja, label: 日本語, short: JA, dir: ltr, enabled: false }

# Hero slideshow on the homepage (first image shows first). "position" = which part of the picture to keep in view.
hero_slides:
  - { img: hero.png, position: "70% 30%", mobile: "64% 20%" }
  - { img: u27-main-menu.jpg, position: "55% 40%", mobile: "50% 40%" }
  - { img: u27-gameplay.jpg, position: "60% 50%", mobile: "55% 50%" }
  - { img: u27-stadium.jpg, position: "50% 40%", mobile: "50% 40%" }

# Pages that exist but are not in the main menu (linked from the footer).
extra_pages:
  - { key: media, path: media/ }

# News sections, in the order the tabs appear. A post picks one with "section:" in its file.
news_sections: [announcements, updates, events, licenses]

# Main menu: page key, icon, and path.
nav:
  - { key: home, icon: home, path: "" }
  - { key: game, icon: gamepad, path: game/ }
  - { key: news, icon: news, path: news/ }
  - { key: shop, icon: bag, path: shop/ }
  - { key: community, icon: users, path: community/ }
  - { key: contact, icon: mail, path: contact/ }
