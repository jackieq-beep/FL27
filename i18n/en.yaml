game_page:
  meta_title: "Football League 2027 (FL27) – What's New in the Mobile Soccer Game"
  meta_description: "FL27 brings a refreshed UI and home screen, a new Career Mode page, updated match visuals, a new stadium, new daily challenges and continued Local PvP improvements. Free on iOS and Android."
  kicker: "What's new this season"
  title_1: The new season
  title_2: starts here.
  text: "FL27 brings a cleaner, more modern look, a redesigned Career Mode, updated match visuals, a new stadium, new daily challenges and a Local PvP that keeps improving."
  jump: "What's new"
  features:
    - key: ui
      label: "New look"
      title: "A cleaner, more modern look"
      text: "FL27 introduces a refreshed interface with a cleaner, more modern visual style. We've redesigned the home screen and how modes are presented, so navigation is clearer and the whole game has a fresher, more premium look."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Career Mode"
      title: "A new home for Career Mode"
      text: "Career Mode has been redesigned in FL27, with a new dedicated page and further gameplay improvements that make the mode feel more complete and easier to navigate. It gives long-term progression a stronger identity in the game."
      images: [u27-career.jpg]
    - key: visuals
      label: "Match day"
      title: "Updated match visuals"
      text: "FL27 upgrades how matches look: a redesigned pre-match loading experience, updated in-game buttons and UI, a new Goal Moment presentation and a new stadium environment. Together they make the match experience more polished and visually consistent."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "New stadium"
      title: "A newly designed stadium"
      text: "As with every yearly edition, FL27 brings a newly designed stadium environment, with updated branding, new presentation elements and a stronger matchday atmosphere."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Daily challenges"
      title: "New daily challenges"
      text: "New daily challenge content lets you complete short football-based challenges for rewards, adding more variety outside standard matches and longer-term modes."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "Local PvP"
      title: "Play your friends locally"
      text: "Local PvP arrived recently and will keep improving in FL27. Compete directly with friends nearby for a more social way to play."
      images: [u27-pvp.jpg]
  cta_title_1: Ready for
  cta_title_2: kick-off?
  cta_text: "Football League is free to play on iOS and Android."

