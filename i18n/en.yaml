faq:
  kicker: "FAQ"
  title: Questions, answered.
  items:
    - q: "Is Football League free to play?"
      a: "Yes. Football League is free to download and play on Android phones and tablets (Google Play) and on iPhone and iPad (App Store)."
    - q: "Can I play Football League offline?"
      a: "Yes. You can play Football League offline with no Wi-Fi, or go online for live events and challenges. It's a soccer game you can play anywhere."
    - q: "Is Football League a soccer game or a football game?"
      a: "Both! Football League is a mobile soccer game. Most of the world calls the sport football, and in the US it's called soccer. Same game, same beautiful sport."
    - q: "What can I play in Football League?"
      a: "Career Mode, Local PvP against friends nearby, friendlies with any two clubs, daily skill challenges, live events, and leagues and cups from around the world."
    - q: "Who makes Football League?"
      a: "Football League is developed and published by Mobile Soccer, an independent mobile game studio making free football games for players everywhere."

