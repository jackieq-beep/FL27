game_page:
  meta_title: "Football League 2027 (FL27) – Fitur Baru di Game Sepak Bola Mobile"
  meta_description: "FL27 hadir dengan layar utama baru, Mode Karier yang dirombak, visual pertandingan yang ditingkatkan, stadion baru, tantangan harian, dan Local PvP. Gratis di iOS dan Android."
  kicker: "Yang baru musim ini"
  title_1: "Musim baru"
  title_2: "dimulai di sini."
  text: "FL27 adalah penyegaran terbesar kami: tampilan lebih bersih, Mode Karier yang dirombak, visual hari pertandingan yang ditingkatkan, dan cara baru bermain bersama teman."
  jump: "Apa yang baru"
  features:
    - key: ui
      label: "Tampilan baru"
      title: "Layar utama lebih bersih dan cepat"
      text: "FL27 menghadirkan antarmuka yang sepenuhnya diperbarui dengan gaya yang lebih bersih dan modern. Layar utama yang didesain ulang menempatkan setiap mode hanya sekali ketuk, jadi kamu lebih cepat menemukan laga berikutnya, dan seluruh game terlihat serta terasa lebih premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Mode Karier"
      title: "Mode Karier, dirombak total"
      text: "Mode Karier kini punya hub khusus. Kelola transfer dan keuangan, capai target direksi, pantau klasemen liga dari pekan ke pekan, dan kejar gelar sepanjang satu musim penuh, dengan peningkatan gameplay yang membuat perjalanan panjang jadi lebih memuaskan."
      images: [u27-career.jpg]
    - key: visuals
      label: "Hari pertandingan"
      title: "Setiap laga tampil lebih tajam"
      text: "Hari pertandingan ditingkatkan dari kick-off hingga peluit akhir: layar pra-pertandingan baru, tombol dan HUD dalam game yang didesain ulang, serta Momen Gol baru yang menyorot sang pencetak gol. Hasilnya, pengalaman yang lebih rapi dan konsisten."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Stadion baru"
      title: "Kandang yang benar-benar baru"
      text: "Setiap edisi mendapat stadion baru, dan stadion FL27 adalah yang paling meriah sejauh ini: tribun penuh, lampu terang, layar raksasa, dan branding Football League yang segar, membuat setiap laga terasa seperti malam besar."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Tantangan harian"
      title: "Tantangan harian, hadiah harian"
      text: "Tantangan sepak bola singkat berbasis skill hadir setiap hari. Capai target, kalahkan kiper, dan kumpulkan permata serta koin. Pas banget untuk beberapa menit di sela pertandingan."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "Local PvP"
      title: "Lawan temanmu, tatap muka"
      text: "Tantang teman di dekatmu dan buktikan di lapangan. Local PvP makin seru di FL27, membuat Football League lebih sosial dari sebelumnya."
      images: [u27-pvp.jpg]
  cta_title_1: "Siap untuk"
  cta_title_2: "kick-off?"
  cta_text: "Football League gratis dimainkan di iOS dan Android."

