faq:
  kicker: "FAQ"
  title: "Pertanyaan, terjawab."
  items:
    - q: "Apakah Football League gratis dimainkan?"
      a: "Ya. Football League gratis diunduh dan dimainkan di ponsel dan tablet Android (Google Play) serta di iPhone dan iPad (App Store)."
    - q: "Bisakah saya memainkan Football League secara offline?"
      a: "Bisa. Kamu bisa main Football League offline tanpa Wi-Fi, atau online untuk event live dan tantangan. Ini game sepak bola yang bisa dimainkan di mana saja."
    - q: "Football League itu game soccer atau game football?"
      a: "Dua-duanya! Football League adalah game sepak bola mobile. Sebagian besar dunia menyebut olahraga ini football, sementara di AS disebut soccer. Game yang sama, olahraga indah yang sama."
    - q: "Apa saja yang bisa dimainkan di Football League?"
      a: "Mode Karier, Local PvP melawan teman di dekatmu, laga persahabatan dengan dua klub mana saja, tantangan skill harian, event live, serta liga dan piala dari seluruh dunia."
    - q: "Siapa pembuat Football League?"
      a: "Football League dikembangkan dan diterbitkan oleh Mobile Soccer, studio game mobile independen yang membuat game sepak bola gratis untuk pemain di mana saja."
    - q: "Apakah Football League 2027 sudah rilis?"
      a: "Ya. Football League 2027 (FL27) sudah tersedia gratis di iPhone dan Android, dengan tampilan baru, Mode Karier yang didesain ulang, dan stadion baru. Unduh di App Store atau Google Play."

