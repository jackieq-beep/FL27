game_page:
  meta_title: "Football League 2027 (FL27) – Fitur Baru di Game Sepak Bola Mobile"
  meta_description: "FL27 hadir dengan UI dan layar utama baru, halaman Mode Karier baru, visual pertandingan yang diperbarui, stadion baru, tantangan harian baru, dan Local PvP yang terus ditingkatkan. Gratis di iOS dan Android."
  kicker: "Yang baru musim ini"
  title_1: "Musim baru"
  title_2: "dimulai di sini."
  text: "FL27 hadir dengan tampilan yang lebih bersih dan modern, Mode Karier yang didesain ulang, visual pertandingan yang diperbarui, stadion baru, tantangan harian baru, dan Local PvP yang terus ditingkatkan."
  jump: "Apa yang baru"
  features:
    - key: ui
      label: "Tampilan baru"
      title: "Tampilan lebih bersih dan modern"
      text: "FL27 menghadirkan antarmuka baru dengan gaya visual yang lebih bersih dan modern. Kami mendesain ulang layar utama dan tampilan mode agar navigasi lebih jelas, sekaligus membuat game terlihat lebih segar dan premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Mode Karier"
      title: "Halaman baru untuk Mode Karier"
      text: "Di FL27, Mode Karier didesain ulang dengan halaman khusus yang baru serta peningkatan gameplay lebih lanjut, agar mode ini terasa lebih lengkap dan lebih mudah dinavigasi. Progres jangka panjang pun punya identitas yang lebih kuat di dalam game."
      images: [u27-career.jpg]
    - key: visuals
      label: "Hari pertandingan"
      title: "Visual pertandingan yang diperbarui"
      text: "FL27 meningkatkan visual pertandingan: pengalaman loading sebelum laga yang didesain ulang, tombol dan elemen UI dalam game yang diperbarui, tampilan Goal Moment yang baru, dan lingkungan stadion baru. Semua ini membuat pengalaman bertanding terasa lebih rapi dan konsisten secara visual."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Stadion baru"
      title: "Stadion dengan desain baru"
      text: "Seperti setiap edisi tahunan, FL27 menghadirkan lingkungan stadion dengan desain baru, branding yang diperbarui, elemen presentasi baru, dan suasana hari pertandingan yang lebih terasa."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Tantangan harian"
      title: "Tantangan harian baru"
      text: "Konten tantangan harian baru: selesaikan tantangan sepak bola singkat untuk mendapatkan hadiah, dan nikmati lebih banyak variasi di luar laga biasa dan mode jangka panjang."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "Local PvP"
      title: "Lawan temanmu secara lokal"
      text: "Local PvP baru saja hadir dan akan terus ditingkatkan di FL27. Bertanding langsung dengan teman di dekatmu untuk cara bermain yang lebih sosial."
      images: [u27-pvp.jpg]
  cta_title_1: "Siap untuk"
  cta_title_2: "kick-off?"
  cta_text: "Football League gratis dimainkan di iOS dan Android."

