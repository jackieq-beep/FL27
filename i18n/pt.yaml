game_page:
  meta_title: "Football League 2027 (FL27) – Novidades do Jogo de Futebol para Celular"
  meta_description: "O FL27 traz uma tela inicial renovada, um Modo Carreira reconstruído, visual de partida melhorado, um estádio novinho, desafios diários e PvP Local. Grátis no iOS e Android."
  kicker: "Novidades desta temporada"
  title_1: A nova temporada
  title_2: começa aqui.
  text: "O FL27 é a nossa maior renovação até agora: visual mais limpo, Modo Carreira reconstruído, dia de jogo com visual melhorado e novas formas de jogar com os amigos."
  jump: "Novidades"
  features:
    - key: ui
      label: "Novo visual"
      title: "Uma tela inicial mais limpa e rápida"
      text: "O FL27 traz uma interface totalmente renovada, com um estilo mais limpo e moderno. A nova tela inicial deixa todos os modos a um toque de distância, para você achar sua próxima partida mais rápido, e o jogo inteiro tem cara e sensação mais premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Modo Carreira"
      title: "Modo Carreira, reconstruído"
      text: "O Modo Carreira agora tem seu próprio hub. Gerencie transferências e finanças, bata as metas da diretoria, acompanhe a tabela rodada a rodada e brigue pelo título ao longo de uma temporada inteira, com melhorias de jogabilidade que deixam a jornada mais recompensadora."
      images: [u27-career.jpg]
    - key: visuals
      label: "Dia de jogo"
      title: "Cada partida mais nítida"
      text: "O dia de jogo foi turbinado do pontapé inicial ao apito final: nova tela pré-jogo, botões e HUD redesenhados e um Momento do Gol novinho que coloca o artilheiro em destaque. Tudo junto, uma experiência mais caprichada e consistente."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Novo estádio"
      title: "Uma casa novinha em folha"
      text: "Toda edição ganha um estádio novo, e o do FL27 é o mais vibrante até hoje: arquibancadas lotadas, refletores, telões gigantes e a nova identidade do Football League, para cada partida parecer noite de decisão."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Desafios diários"
      title: "Desafios diários, recompensas diárias"
      text: "Desafios de futebol rápidos e baseados em habilidade chegam todos os dias. Bata as metas, vença o goleiro e colete gemas e moedas. Perfeitos para uns minutinhos entre as partidas."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "PvP Local"
      title: "Jogue com os amigos, frente a frente"
      text: "Desafie amigos por perto e resolva tudo dentro de campo. O PvP Local fica cada vez melhor no FL27, deixando o Football League mais social do que nunca."
      images: [u27-pvp.jpg]
  cta_title_1: Pronto para
  cta_title_2: o apito inicial?
  cta_text: "Football League é grátis para jogar no iOS e Android."

