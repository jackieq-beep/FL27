game_page:
  meta_title: "Football League 2027 (FL27) – Novidades do Jogo de Futebol para Celular"
  meta_description: "O FL27 traz interface e tela inicial renovadas, uma nova página do Modo Carreira, visual de partida atualizado, um estádio novo e novos desafios diários. Grátis no iOS e Android."
  kicker: "Novidades desta temporada"
  title_1: A nova temporada
  title_2: começa aqui.
  text: "O FL27 traz um visual mais limpo e moderno, Modo Carreira redesenhado, visual de partida atualizado, um estádio novo e novos desafios diários."
  jump: "Novidades"
  features:
    - key: ui
      label: "Novo visual"
      title: "Um visual mais limpo e moderno"
      text: "O FL27 traz uma interface renovada, com um estilo visual mais limpo e moderno. Redesenhamos a tela inicial e a apresentação dos modos para deixar a navegação mais clara e dar ao jogo um visual mais fresco e premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Modo Carreira"
      title: "Uma nova página para o Modo Carreira"
      text: "No FL27, redesenhamos o Modo Carreira, com uma nova página dedicada e mais melhorias de jogabilidade para o modo ficar mais completo e fácil de navegar. Assim, a progressão de longo prazo ganha mais identidade dentro do jogo."
      images: [u27-career.jpg]
    - key: visuals
      label: "Dia de jogo"
      title: "Visual de partida atualizado"
      text: "O FL27 melhora o visual das partidas: tela de carregamento pré-jogo redesenhada, botões e elementos de interface atualizados, nova apresentação do Momento do Gol e um estádio novo. Tudo isso deixa a experiência de partida mais caprichada e visualmente consistente."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Novo estádio"
      title: "Um estádio com design novo"
      text: "Como em toda edição anual, o FL27 traz um estádio com design novo, identidade visual atualizada, novos elementos de apresentação e mais clima de dia de jogo."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Desafios diários"
      title: "Novos desafios diários"
      text: "Novos desafios diários: complete desafios curtos de futebol para ganhar recompensas e tenha mais variedade além das partidas normais e dos modos de longo prazo."
      images: [u27-penalty.jpg]
  cta_title_1: Pronto para
  cta_title_2: o apito inicial?
  cta_text: "Football League é grátis para jogar no iOS e Android."

