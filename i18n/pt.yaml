faq:
  kicker: "Perguntas frequentes"
  title: Suas dúvidas, respondidas.
  items:
    - q: "O Football League é grátis?"
      a: "Sim. O Football League é grátis para baixar e jogar em celulares e tablets Android (Google Play) e em iPhone e iPad (App Store)."
    - q: "Dá para jogar Football League offline?"
      a: "Sim. Você pode jogar Football League offline, sem Wi-Fi, ou ficar online para eventos ao vivo e desafios. É um jogo de futebol para jogar em qualquer lugar."
    - q: "Football League é um jogo de soccer ou de football?"
      a: "Os dois! Football League é um jogo de futebol para celular. A maior parte do mundo chama o esporte de football, e nos EUA ele é chamado de soccer. Mesmo jogo, mesmo esporte apaixonante."
    - q: "O que dá para jogar no Football League?"
      a: "Modo Carreira, PvP Local contra amigos por perto, amistosos com quaisquer dois clubes, desafios diários de habilidade, eventos ao vivo e ligas e copas do mundo todo."
    - q: "O Football League tem clubes reais?"
      a: "Sim. O Manchester City tem licença oficial no Football League, com uniformes autênticos e o escudo oficial do clube."
    - q: "Quem faz o Football League?"
      a: "O Football League é desenvolvido e publicado pela Mobile Soccer, um estúdio independente de jogos mobile que cria jogos de futebol grátis para jogadores do mundo todo."
    - q: "Quando sai o Football League 2027?"
      a: "O Football League 2027 (FL27) chega em breve, com visual renovado, Modo Carreira reconstruído e um estádio novinho. Acompanhe nossa página de Notícias e nossas redes sociais para saber primeiro."

