faq:
  kicker: "常见问题"
  title: "你问，我答。"
  items:
    - q: "Football League 是免费的吗？"
      a: "是的。Football League 可在 Android 手机和平板（Google Play）以及 iPhone 和 iPad（App Store）上免费下载和游玩。"
    - q: "Football League 可以离线玩吗？"
      a: "可以。没有 Wi-Fi 也能离线畅玩 Football League，联网还能参加实时活动和挑战。这是一款随时随地都能玩的足球游戏。"
    - q: "Football League 是 soccer 游戏还是 football 游戏？"
      a: "都是！Football League 是一款手机足球游戏。世界上大多数地方把这项运动叫 football，在美国则叫 soccer。同一款游戏，同一项美丽运动。"
    - q: "Football League 里能玩什么？"
      a: "生涯模式、与身边好友对战的本地 PvP、任选两队的友谊赛、每日技巧挑战、实时活动，以及来自世界各地的联赛和杯赛。"
    - q: "Football League 有真实俱乐部吗？"
      a: "有。Manchester City 已正式授权入驻 Football League，拥有正版球衣和官方俱乐部队徽。"
    - q: "Football League 是谁开发的？"
      a: "Football League 由 Mobile Soccer 开发并发行，这是一家独立手游工作室，致力于为全球玩家打造免费足球游戏。"
    - q: "Football League 2027 什么时候推出？"
      a: "Football League 2027（FL27）即将登场，带来焕新外观、重制生涯模式和全新球场。关注我们的新闻页面和社交媒体，第一时间获取消息。"

