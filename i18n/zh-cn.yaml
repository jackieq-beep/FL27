game_page:
  meta_title: "Football League 2027 (FL27) – 手机足球游戏全新内容"
  meta_description: "FL27 带来焕新界面与主界面、全新生涯模式页面、升级的比赛画面、全新球场、新的每日挑战，本地 PvP 也将持续优化。iOS 和 Android 免费畅玩。"
  kicker: "本赛季新内容"
  title_1: "新赛季"
  title_2: "从这里开始。"
  text: "FL27 带来更简洁现代的外观、重新设计的生涯模式、升级的比赛画面、全新球场和新的每日挑战，本地 PvP 也将持续优化。"
  jump: "新内容一览"
  features:
    - key: ui
      label: "全新外观"
      title: "更简洁、更现代的外观"
      text: "FL27 焕新了用户界面，视觉风格更简洁、更现代。我们重新设计了主界面和模式展示，让导航更清晰，也让整个游戏看起来更清新、更高级。"
      images: [u27-main-menu.jpg]
    - key: career
      label: "生涯模式"
      title: "生涯模式全新页面"
      text: "FL27 重新设计了生涯模式的呈现方式，新增专属页面，并进一步改进玩法，让这一模式更完整、更易于浏览。我们希望让长期养成类模式在游戏中拥有更鲜明的定位。"
      images: [u27-career.jpg]
    - key: visuals
      label: "比赛日"
      title: "升级的比赛画面"
      text: "FL27 对比赛画面做了多项升级，包括重新设计的赛前加载体验、更新的游戏内按钮和界面元素、进球时刻演出以及全新的球场环境，让整体比赛体验更精致、视觉风格更统一。"
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "全新球场"
      title: "全新设计的球场"
      text: "和每一年的新版本一样，FL27 带来全新设计的球场环境，配有更新的品牌元素和展示元素，比赛日氛围更加浓厚。"
      images: [u27-stadium.jpg]
    - key: challenges
      label: "每日挑战"
      title: "新的每日挑战"
      text: "新增每日挑战内容：完成简短的足球挑战即可获得奖励，在常规比赛和长期模式之外带来更多玩法变化。"
      images: [u27-penalty.jpg]
    - key: pvp
      label: "本地 PvP"
      title: "和身边好友面对面对战"
      text: "本地 PvP 近期刚刚推出，并将在 FL27 中持续优化。你可以和身边的好友直接对战，玩法更具社交乐趣。"
      images: [u27-pvp.jpg]
  cta_title_1: "准备好"
  cta_title_2: "开球了吗？"
  cta_text: "Football League 在 iOS 和 Android 上免费畅玩。"

