faq:
  kicker: "FAQ"
  title: よくある質問
  items:
    - q: "Football Leagueは無料で遊べますか？"
      a: "はい。Football Leagueは、Androidのスマホ・タブレット（Google Play）とiPhone・iPad（App Store）で、無料でダウンロードしてプレイできます。"
    - q: "Football Leagueはオフラインでも遊べますか？"
      a: "はい。Wi-Fiがなくてもオフラインでプレイできます。オンラインならライブイベントやチャレンジにも参加可能。どこでも遊べるサッカーゲームです。"
    - q: "Football Leagueは「サッカー」のゲーム？それとも「フットボール」のゲーム？"
      a: "どちらも正解！Football Leagueはモバイルサッカーゲームです。世界の多くの国ではこのスポーツを「フットボール」と呼び、アメリカや日本では「サッカー」と呼びます。同じゲーム、同じ美しいスポーツです。"
    - q: "Football Leagueでは何ができますか？"
      a: "キャリアモード、近くの友だちと対戦できるローカルPvP、好きな2クラブで戦うフレンドリーマッチ、デイリースキルチャレンジ、ライブイベント、そして世界中のリーグやカップ戦が楽しめます。"
    - q: "Football Leagueには実在のクラブは登場しますか？"
      a: "はい。マンチェスター・シティが公式ライセンスで登場し、本物のユニフォームと公式クラブエンブレムを使用できます。"
    - q: "Football Leagueを開発しているのは？"
      a: "Football Leagueは、世界中のプレイヤーに向けて無料のサッカーゲームを作るインディーモバイルゲームスタジオ、Mobile Soccerが開発・配信しています。"
    - q: "Football League 2027はいつリリースされますか？"
      a: "Football League 2027（FL27）はまもなく登場予定です。デザインの一新、再構築されたキャリアモード、新スタジアムを搭載。最新情報はニュースページと公式SNSでいち早くお届けします。"

