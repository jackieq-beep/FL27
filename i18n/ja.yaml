game_page:
  meta_title: "Football League 2027 (FL27) – モバイルサッカーゲームの新要素"
  meta_description: "FL27では、ホーム画面を一新し、キャリアモードを再構築。試合のビジュアル強化、新スタジアム、デイリーチャレンジ、ローカルPvPも登場。iOS・Androidで無料。"
  kicker: "今シーズンの新要素"
  title_1: 新シーズンは
  title_2: ここから始まる。
  text: "FL27は過去最大のリニューアル。よりスッキリしたデザイン、再構築されたキャリアモード、パワーアップした試合のビジュアル、そして友だちと遊べる新しい楽しみ方が登場します。"
  jump: "新要素を見る"
  features:
    - key: ui
      label: "新デザイン"
      title: "スッキリ、サクサクのホーム画面"
      text: "FL27では、よりスッキリとモダンなスタイルにインターフェースを全面リニューアル。新しいホーム画面ではすべてのモードにワンタップでアクセスでき、次の試合をすぐに見つけられます。ゲーム全体の見た目も手ざわりも、より上質に。"
      images: [u27-main-menu.jpg]
    - key: career
      label: "キャリアモード"
      title: "キャリアモード、再構築"
      text: "キャリアモードに専用ハブが登場。移籍と財務を管理し、フロントの目標を達成し、節ごとにリーグ順位表を追いながら、フルシーズンで優勝を目指そう。ゲームプレイの改善で、長いシーズンを戦い抜く達成感もさらにアップしました。"
      images: [u27-career.jpg]
    - key: visuals
      label: "試合演出"
      title: "すべての試合がより鮮明に"
      text: "キックオフから試合終了まで、試合演出をアップグレード。新しい試合前画面、デザインを一新したゲーム内ボタンとHUD、そしてゴールを決めた選手にスポットライトを当てる新演出「ゴールモーメント」。より洗練され、統一感のある体験を実現しました。"
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "新スタジアム"
      title: "まったく新しいホームスタジアム"
      text: "毎作新たなスタジアムが登場しますが、FL27のスタジアムは過去最高の臨場感。満員のスタンド、まばゆい照明、巨大スクリーン、そして新しいFootball Leagueのブランディングが、すべての試合をビッグマッチの夜に変えます。"
      images: [u27-stadium.jpg]
    - key: challenges
      label: "デイリーチャレンジ"
      title: "毎日のチャレンジで、毎日報酬"
      text: "スキルを試す短いサッカーチャレンジが毎日登場。目標を達成し、キーパーを打ち破って、ジェムとコインを集めよう。試合の合間の数分にぴったりです。"
      images: [u27-penalty.jpg]
    - key: pvp
      label: "ローカルPvP"
      title: "友だちと、顔を合わせて対戦"
      text: "近くの友だちに挑戦して、ピッチで決着をつけよう。FL27でローカルPvPはさらに進化し、Football Leagueはこれまで以上にみんなで楽しめるゲームになりました。"
      images: [u27-pvp.jpg]
  cta_title_1: キックオフの
  cta_title_2: 準備はいい？
  cta_text: "Football LeagueはiOSとAndroidで無料でプレイできます。"

