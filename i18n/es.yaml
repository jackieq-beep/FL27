game_page:
  meta_title: "Football League 2027 (FL27) – Novedades del juego de fútbol para móvil"
  meta_description: "FL27 trae una pantalla de inicio renovada, un Modo Carrera reconstruido, mejores gráficos en los partidos, un estadio nuevo, desafíos diarios y PvP local. Gratis en iOS y Android."
  kicker: "Novedades de esta temporada"
  title_1: La nueva temporada
  title_2: empieza aquí.
  text: "FL27 es nuestra mayor renovación hasta ahora: un aspecto más limpio, un Modo Carrera reconstruido, gráficos mejorados en los partidos y nuevas formas de jugar con amigos."
  jump: "Novedades"
  features:
    - key: ui
      label: "Nuevo aspecto"
      title: "Una pantalla de inicio más limpia y rápida"
      text: "FL27 estrena una interfaz totalmente renovada, con un estilo más limpio y moderno. La nueva pantalla de inicio pone todos los modos a un toque, para que encuentres tu próximo partido más rápido, y todo el juego se ve y se siente más premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Modo Carrera"
      title: "Modo Carrera, reconstruido"
      text: "El Modo Carrera ahora tiene su propio centro de control. Gestiona fichajes y finanzas, cumple los objetivos de la directiva, sigue la clasificación jornada a jornada y pelea por el título durante toda una temporada, con mejoras de jugabilidad que hacen que el largo plazo sea más gratificante."
      images: [u27-career.jpg]
    - key: visuals
      label: "Día de partido"
      title: "Cada partido se ve más nítido"
      text: "El día de partido se ha mejorado del saque inicial al pitido final: una nueva pantalla previa, botones e interfaz rediseñados durante el juego y un nuevo Momento del Gol que pone al goleador en el centro de atención. Todo suma para una experiencia más pulida y coherente."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Nuevo estadio"
      title: "Un estadio completamente nuevo"
      text: "Cada edición estrena estadio, y el de FL27 es el que más ambiente tiene hasta ahora: gradas llenas, focos brillantes, pantallas gigantes y la nueva imagen de Football League para que cada partido se viva como una gran noche."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Desafíos diarios"
      title: "Desafíos diarios, premios diarios"
      text: "Cada día llegan desafíos de fútbol cortos y de habilidad. Cumple los objetivos, bate al portero y consigue gemas y monedas. Perfectos para unos minutos entre partido y partido."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "PvP local"
      title: "Juega contra tus amigos, cara a cara"
      text: "Reta a tus amigos cercanos y demuestra quién manda en el campo. El PvP local sigue mejorando en FL27 y hace que Football League sea más social que nunca."
      images: [u27-pvp.jpg]
  cta_title_1: "¿Listo para"
  cta_title_2: el saque inicial?
  cta_text: "Football League es gratis en iOS y Android."

