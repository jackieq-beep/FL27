faq:
  kicker: "Preguntas frecuentes"
  title: Tus preguntas, respondidas.
  items:
    - q: "¿Football League es gratis?"
      a: "Sí. Football League se descarga y se juega gratis en teléfonos y tablets Android (Google Play) y en iPhone y iPad (App Store)."
    - q: "¿Puedo jugar a Football League sin conexión?"
      a: "Sí. Puedes jugar a Football League sin conexión y sin Wi-Fi, o conectarte para disfrutar de eventos en vivo y desafíos. Es un juego de fútbol para jugar donde quieras."
    - q: "¿Football League es un juego de soccer o de fútbol?"
      a: "¡Las dos cosas! Football League es un juego de fútbol para móvil. En casi todo el mundo este deporte se llama fútbol, y en Estados Unidos lo llaman soccer. El mismo juego, el mismo deporte rey."
    - q: "¿Qué puedo jugar en Football League?"
      a: "Modo Carrera, PvP local contra amigos cercanos, amistosos con dos clubes cualesquiera, desafíos de habilidad diarios, eventos en vivo y ligas y copas de todo el mundo."
    - q: "¿Quién desarrolla Football League?"
      a: "Football League está desarrollado y publicado por Mobile Soccer, un estudio independiente de juegos para móvil que crea juegos de fútbol gratis para jugadores de todo el mundo."

