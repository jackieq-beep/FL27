game_page:
  meta_title: "Football League 2027 (FL27) – Novedades del juego de fútbol para móvil"
  meta_description: "FL27 trae una interfaz y pantalla de inicio renovadas, una nueva página del Modo Carrera, gráficos de partido actualizados, un estadio nuevo, nuevos desafíos diarios y mejoras continuas en el PvP local. Gratis en iOS y Android."
  kicker: "Novedades de esta temporada"
  title_1: La nueva temporada
  title_2: empieza aquí.
  text: "FL27 trae un aspecto más limpio y moderno, un Modo Carrera rediseñado, gráficos de partido actualizados, un estadio nuevo, nuevos desafíos diarios y un PvP local que sigue mejorando."
  jump: "Novedades"
  features:
    - key: ui
      label: "Nuevo aspecto"
      title: "Un aspecto más limpio y moderno"
      text: "FL27 estrena una interfaz renovada con un estilo visual más limpio y moderno. Hemos rediseñado la pantalla de inicio y la presentación de los modos para que la navegación sea más clara y todo el juego luzca más fresco y premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Modo Carrera"
      title: "Un nuevo espacio para el Modo Carrera"
      text: "En FL27 hemos rediseñado el Modo Carrera, con una nueva página propia y más mejoras de jugabilidad para que el modo se sienta más completo y sea más fácil de navegar. Así, la progresión a largo plazo gana identidad dentro del juego."
      images: [u27-career.jpg]
    - key: visuals
      label: "Día de partido"
      title: "Gráficos de partido actualizados"
      text: "FL27 mejora el aspecto de los partidos: una pantalla de carga previa rediseñada, botones y elementos de interfaz actualizados, una nueva presentación del Momento de Gol y un nuevo estadio. Todo ello hace que la experiencia de partido sea más pulida y visualmente coherente."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Nuevo estadio"
      title: "Un estadio de nuevo diseño"
      text: "Como en cada edición anual, FL27 estrena un estadio de nuevo diseño, con imagen de marca actualizada, nuevos elementos de presentación y más ambiente de día de partido."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Desafíos diarios"
      title: "Nuevos desafíos diarios"
      text: "Nuevo contenido de desafíos diarios: completa desafíos futbolísticos cortos para ganar recompensas y disfruta de más variedad fuera de los partidos normales y de los modos a largo plazo."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "PvP local"
      title: "Juega contra tus amigos en local"
      text: "El PvP local llegó hace poco y seguirá mejorando en FL27. Compite directamente con amigos cercanos para una forma de jugar más social."
      images: [u27-pvp.jpg]
  cta_title_1: "¿Listo para"
  cta_title_2: el saque inicial?
  cta_text: "Football League es gratis en iOS y Android."

