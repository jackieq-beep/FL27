faq:
  kicker: "الأسئلة الشائعة"
  title: "أسئلة وأجوبة."
  items:
    - q: "هل Football League مجانية؟"
      a: "نعم. يمكنك تحميل Football League واللعب بها مجانًا على هواتف وأجهزة Android اللوحية (Google Play) وعلى iPhone و iPad (App Store)."
    - q: "هل يمكنني لعب Football League بدون إنترنت؟"
      a: "نعم. يمكنك لعب Football League بدون إنترنت أو Wi-Fi، أو الاتصال بالإنترنت للمشاركة في الفعاليات والتحديات المباشرة. إنها لعبة كرة قدم تلعبها في أي مكان."
    - q: "هل Football League لعبة soccer أم football؟"
      a: "الاثنان معًا! Football League لعبة كرة قدم على الجوال. معظم العالم يسمي هذه الرياضة football، بينما تُسمى في الولايات المتحدة soccer. اللعبة نفسها، والرياضة الجميلة نفسها."
    - q: "ماذا يمكنني أن ألعب في Football League؟"
      a: "وضع المسيرة، و Local PvP ضد أصدقائك القريبين، ومباريات ودية بين أي ناديين، وتحديات مهارة يومية، وفعاليات مباشرة، ودوريات وكؤوس من حول العالم."
    - q: "هل تضم Football League أندية حقيقية؟"
      a: "نعم. مانشستر سيتي مرخّص رسميًا في Football League، بأطقم أصلية وشعار النادي الرسمي."
    - q: "من يطوّر Football League؟"
      a: "Football League من تطوير ونشر Mobile Soccer، وهو استوديو مستقل لألعاب الجوال يصنع ألعاب كرة قدم مجانية للاعبين في كل مكان."
    - q: "متى تصدر Football League 2027؟"
      a: "Football League 2027 (FL27) قادمة قريبًا، بمظهر متجدد ووضع مسيرة أُعيد بناؤه وملعب جديد كليًا. تابع صفحة الأخبار وحساباتنا على مواقع التواصل لتعرف أولًا."

