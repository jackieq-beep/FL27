game_page:
  meta_title: "Football League 2027 (FL27) – ما الجديد في لعبة كرة القدم على الجوال"
  meta_description: "تقدّم FL27 شاشة رئيسية متجددة، ووضع مسيرة أُعيد بناؤه، ورسومات مباريات مطوّرة، وملعبًا جديدًا كليًا، وتحديات يومية و Local PvP. مجانًا على iOS و Android."
  kicker: "ما الجديد هذا الموسم"
  title_1: "الموسم الجديد"
  title_2: "يبدأ هنا."
  text: "FL27 هي أكبر تجديد لنا حتى الآن: مظهر أنظف، ووضع مسيرة أُعيد بناؤه، ورسومات مطوّرة ليوم المباراة، وطرق جديدة للعب مع الأصدقاء."
  jump: "ما الجديد"
  features:
    - key: ui
      label: "مظهر جديد"
      title: "شاشة رئيسية أنظف وأسرع"
      text: "تأتي FL27 بواجهة متجددة بالكامل بأسلوب أنظف وأكثر عصرية. الشاشة الرئيسية الجديدة تضع كل الأوضاع على بُعد لمسة واحدة، فتصل إلى مباراتك التالية أسرع، وتبدو اللعبة بأكملها أكثر فخامة."
      images: [u27-main-menu.jpg]
    - key: career
      label: "وضع المسيرة"
      title: "وضع المسيرة بحلة جديدة"
      text: "أصبح لوضع المسيرة مركز خاص به. أدِر الانتقالات والميزانية، وحقق أهداف الإدارة، وتابع جدول الدوري جولة بجولة، وطارد اللقب على مدار موسم كامل، مع تحسينات في أسلوب اللعب تجعل المشوار الطويل أكثر متعة."
      images: [u27-career.jpg]
    - key: visuals
      label: "يوم المباراة"
      title: "كل مباراة أوضح وأجمل"
      text: "تطوّر يوم المباراة من ضربة البداية حتى صافرة النهاية: شاشة جديدة قبل المباراة، وأزرار وواجهة لعب أُعيد تصميمها، ولحظة هدف جديدة كليًا تسلّط الضوء على صاحب الهدف. كل ذلك يصنع تجربة أكثر صقلًا وانسجامًا."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "ملعب جديد"
      title: "ملعب جديد كليًا لفريقك"
      text: "كل إصدار يحصل على ملعب جديد، وملعب FL27 هو الأكثر حماسًا حتى الآن: مدرجات ممتلئة وأضواء ساطعة وشاشات عملاقة وهوية Football League الجديدة، لتشعر أن كل مباراة ليلة كبرى."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "تحديات يومية"
      title: "تحديات يومية ومكافآت يومية"
      text: "تحديات كرة قدم قصيرة تعتمد على المهارة تصلك كل يوم. حقق الأهداف، وتغلّب على الحارس، واجمع الجواهر والعملات. مثالية لدقائق قليلة بين المباريات."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "Local PvP"
      title: "واجه أصدقاءك وجهًا لوجه"
      text: "تحدَّ أصدقاءك القريبين منك واحسم الأمر على أرض الملعب. يواصل Local PvP التطور في FL27، ليجعل Football League أكثر اجتماعية من أي وقت مضى."
      images: [u27-pvp.jpg]
