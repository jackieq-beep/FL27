game_page:
  meta_title: "Football League 2027 (FL27) – ما الجديد في لعبة كرة القدم على الجوال"
  meta_description: "تقدّم FL27 واجهة وشاشة رئيسية متجددة، وصفحة جديدة لوضع المسيرة، ورسومات مباريات محدّثة، وملعبًا جديدًا، وتحديات يومية جديدة، مع تحسينات مستمرة على Local PvP. مجانًا على iOS و Android."
  kicker: "ما الجديد هذا الموسم"
  title_1: "الموسم الجديد"
  title_2: "يبدأ هنا."
  text: "تقدّم FL27 مظهرًا أنظف وأكثر عصرية، ووضع مسيرة بتصميم جديد، ورسومات مباريات محدّثة، وملعبًا جديدًا، وتحديات يومية جديدة، مع Local PvP يواصل التحسّن."
  jump: "ما الجديد"
  features:
    - key: ui
      label: "مظهر جديد"
      title: "مظهر أنظف وأكثر عصرية"
      text: "تقدّم FL27 واجهة متجددة بأسلوب بصري أنظف وأكثر عصرية. أعدنا تصميم الشاشة الرئيسية وطريقة عرض الأوضاع ليصبح التنقّل أوضح، مع منح اللعبة مظهرًا أكثر انتعاشًا وفخامة."
      images: [u27-main-menu.jpg]
    - key: career
      label: "وضع المسيرة"
      title: "صفحة جديدة لوضع المسيرة"
      text: "أعدنا في FL27 تصميم طريقة عرض وضع المسيرة، مع صفحة جديدة مخصّصة له وتحسينات إضافية في أسلوب اللعب، ليبدو الوضع أكثر اكتمالًا وأسهل في التنقّل. والهدف منح أوضاع التقدّم طويلة المدى هوية أقوى داخل اللعبة."
      images: [u27-career.jpg]
    - key: visuals
      label: "يوم المباراة"
      title: "رسومات مباريات محدّثة"
      text: "تتضمّن FL27 مجموعة من التحسينات البصرية أثناء المباريات، منها تجربة تحميل ما قبل المباراة بتصميم جديد، وأزرار وعناصر واجهة محدّثة داخل اللعبة، وعرض جديد للحظة الهدف، وملعب جديد. وكل ذلك يجعل تجربة المباراة أكثر صقلًا وتناسقًا بصريًا."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "ملعب جديد"
      title: "ملعب بتصميم جديد"
      text: "كما في كل إصدار سنوي، تقدّم FL27 ملعبًا بتصميم جديد، مع هوية بصرية محدّثة وعناصر عرض جديدة وأجواء يوم مباراة أقوى."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "تحديات يومية"
      title: "تحديات يومية جديدة"
      text: "محتوى جديد من التحديات اليومية: أكمل تحديات كروية قصيرة لتحصل على مكافآت، واستمتع بتنوّع أكبر خارج المباريات العادية والأوضاع طويلة المدى."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "Local PvP"
      title: "العب ضد أصدقائك محليًا"
      text: "وصل Local PvP مؤخرًا وسيواصل التحسّن في FL27، لتتنافس مباشرة مع أصدقائك القريبين منك بطريقة لعب أكثر اجتماعية."
      images: [u27-pvp.jpg]
