game_page:
  meta_title: "Football League 2027 (FL27) – Les nouveautés du jeu de foot mobile"
  meta_description: "FL27 apporte une interface et un écran d'accueil repensés, une nouvelle page pour le mode Carrière, des visuels de match améliorés, un nouveau stade, de nouveaux défis quotidiens et un PvP local qui continue de progresser. Gratuit sur iOS et Android."
  kicker: "Les nouveautés de la saison"
  title_1: "La nouvelle saison"
  title_2: "commence ici."
  text: "FL27 apporte un look plus épuré et moderne, un mode Carrière repensé, des visuels de match améliorés, un nouveau stade, de nouveaux défis quotidiens et un PvP local qui continue de progresser."
  jump: "Quoi de neuf"
  features:
    - key: ui
      label: "Nouveau look"
      title: "Un look plus épuré et moderne"
      text: "FL27 arrive avec une interface repensée, au style visuel plus épuré et plus moderne. Nous avons redessiné l'écran d'accueil et la présentation des modes pour une navigation plus claire et un jeu au look plus frais et plus premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Mode Carrière"
      title: "Une nouvelle page pour le mode Carrière"
      text: "Dans FL27, le mode Carrière a été repensé, avec une nouvelle page dédiée et d'autres améliorations de gameplay pour un mode plus complet et plus facile à parcourir. La progression sur le long terme gagne ainsi une identité plus forte dans le jeu."
      images: [u27-career.jpg]
    - key: visuals
      label: "Jour de match"
      title: "Des visuels de match améliorés"
      text: "FL27 améliore l'aspect des matchs : un écran de chargement d'avant-match repensé, des boutons et éléments d'interface mis à jour, une nouvelle présentation du Moment But et un nouveau stade. Le tout rend l'expérience de match plus soignée et plus cohérente visuellement."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Nouveau stade"
      title: "Un stade au nouveau design"
      text: "Comme à chaque édition annuelle, FL27 propose un stade au nouveau design, avec un habillage mis à jour, de nouveaux éléments de présentation et une ambiance de jour de match plus marquée."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Défis quotidiens"
      title: "De nouveaux défis quotidiens"
      text: "De nouveaux défis quotidiens t'attendent : relève de courts défis footballistiques pour gagner des récompenses et profite de plus de variété en dehors des matchs classiques et des modes au long cours."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "PvP local"
      title: "Affronte tes amis en local"
      text: "Le PvP local est arrivé récemment et continuera de s'améliorer dans FL27. Affronte directement tes amis à proximité pour une façon de jouer plus sociale."
      images: [u27-pvp.jpg]
  cta_title_1: "Prêt pour"
  cta_title_2: "le coup d'envoi ?"
  cta_text: "Football League est gratuit sur iOS et Android."

