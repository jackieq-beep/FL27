game_page:
  meta_title: "Football League 2027 (FL27) – Les nouveautés du jeu de foot mobile"
  meta_description: "FL27 apporte un écran d'accueil repensé, un mode Carrière reconstruit, des visuels de match améliorés, un tout nouveau stade, des défis quotidiens et le PvP local. Gratuit sur iOS et Android."
  kicker: "Les nouveautés de la saison"
  title_1: "La nouvelle saison"
  title_2: "commence ici."
  text: "FL27, c'est notre plus grosse refonte à ce jour : un look plus épuré, un mode Carrière reconstruit, des visuels de match améliorés et de nouvelles façons de jouer entre potes."
  jump: "Quoi de neuf"
  features:
    - key: ui
      label: "Nouveau look"
      title: "Un écran d'accueil plus clair et plus rapide"
      text: "FL27 arrive avec une interface entièrement repensée, au style plus épuré et plus moderne. Le nouvel écran d'accueil met chaque mode à portée de doigt pour trouver ton prochain match plus vite, et tout le jeu gagne en finition premium."
      images: [u27-main-menu.jpg]
    - key: career
      label: "Mode Carrière"
      title: "Le mode Carrière, reconstruit"
      text: "Le mode Carrière a désormais son propre hub. Gère les transferts et les finances, remplis les objectifs de ta direction, suis le classement journée après journée et vise le titre sur une saison complète, avec des améliorations de gameplay qui rendent le long terme plus gratifiant."
      images: [u27-career.jpg]
    - key: visuals
      label: "Jour de match"
      title: "Chaque match gagne en netteté"
      text: "Le jour de match a été amélioré du coup d'envoi au coup de sifflet final : un nouvel écran d'avant-match, des boutons et un HUD redessinés, et un tout nouveau Moment du but qui met le buteur sous les projecteurs. Résultat : une expérience plus soignée et plus cohérente."
      images: [u27-gameplay.jpg, u27-goal.jpg, u27-friendly.jpg]
    - key: stadium
      label: "Nouveau stade"
      title: "Un tout nouveau stade"
      text: "Chaque édition a droit à son nouveau stade, et celui de FL27 est le plus vibrant à ce jour : tribunes pleines à craquer, projecteurs, écrans géants et nouvel habillage Football League pour que chaque match ait des airs de grande soirée."
      images: [u27-stadium.jpg]
    - key: challenges
      label: "Défis quotidiens"
      title: "Des défis et des récompenses chaque jour"
      text: "De courts défis de foot basés sur la technique arrivent chaque jour. Atteins les objectifs, bats le gardien et récupère gemmes et pièces. Parfait pour quelques minutes entre deux matchs."
      images: [u27-penalty.jpg]
    - key: pvp
      label: "PvP local"
      title: "Affronte tes potes en face-à-face"
      text: "Défie tes amis à proximité et réglez ça sur le terrain. Le PvP local continue de progresser dans FL27, et Football League n'a jamais été aussi social."
      images: [u27-pvp.jpg]
  cta_title_1: "Prêt pour"
  cta_title_2: "le coup d'envoi ?"
  cta_text: "Football League est gratuit sur iOS et Android."

