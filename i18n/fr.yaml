faq:
  kicker: "FAQ"
  title: "Vos questions, nos réponses."
  items:
    - q: "Football League est-il gratuit ?"
      a: "Oui. Football League se télécharge et se joue gratuitement sur smartphones et tablettes Android (Google Play) et sur iPhone et iPad (App Store)."
    - q: "Peut-on jouer à Football League hors ligne ?"
      a: "Oui. Tu peux jouer à Football League hors ligne, sans Wi-Fi, ou passer en ligne pour les événements live et les défis. Un jeu de foot qui se joue partout."
    - q: "Football League, c'est du soccer ou du football ?"
      a: "Les deux ! Football League est un jeu de foot mobile. La majeure partie du monde appelle ce sport football, et aux États-Unis on dit soccer. Même jeu, même sport magnifique."
    - q: "À quoi peut-on jouer dans Football League ?"
      a: "Mode Carrière, PvP local contre des amis à proximité, matchs amicaux entre deux clubs au choix, défis techniques quotidiens, événements live, et des championnats et coupes du monde entier."
    - q: "Qui développe Football League ?"
      a: "Football League est développé et édité par Mobile Soccer, un studio indépendant de jeux mobiles qui crée des jeux de foot gratuits pour les joueurs du monde entier."
    - q: "Football League 2027 est-il sorti ?"
      a: "Oui. Football League 2027 (FL27) est disponible gratuitement sur iPhone et Android, avec un look plus moderne, un mode Carrière repensé et un nouveau stade. Télécharge-le sur l'App Store ou Google Play."

