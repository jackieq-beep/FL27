<!doctype html>
<html lang="{{ lang.code }}" dir="{{ lang.dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.meta.home_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ t.meta.home_description }}{% endblock %}">
  {% block robots %}{% endblock %}
  <link rel="canonical" href="{{ canonical }}">
  {% for l in languages %}
  <link rel="alternate" hreflang="{{ l.code }}" href="{{ site.site_url }}{{ lang_url(l.code, page_path) }}">
  {% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ site.site_url }}{{ lang_url('en', page_path) }}">
  <meta name="theme-color" content="#121214">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.brand }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ site.site_url }}{{ site.base }}/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Football League – free mobile soccer game">
  <meta property="og:locale" content="{{ lang.code | replace('-', '_') }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="{{ site.base }}/favicon.png">
  <link rel="apple-touch-icon" href="{{ site.base }}/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,700;0,900;1,900&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ asset('main.css') }}">
  <script>document.documentElement.classList.add('js')</script>
  <script>
    // Google Consent Mode v2: everything is off until the visitor chooses.
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    (function () {
      var c = null; try { c = JSON.parse(localStorage.getItem("fl_consent") || "null"); } catch (e) {}
      var a = c && c.analytics ? "granted" : "denied", m = c && c.marketing ? "granted" : "denied";
      gtag("consent", "default", { analytics_storage: a, ad_storage: m, ad_user_data: m, ad_personalization: m, functionality_storage: "granted", security_storage: "granted", wait_for_update: 500 });
    })();
  </script>
  {% if site.ga_measurement_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_measurement_id }}"></script>
  <script>gtag("js", new Date()); gtag("config", {{ site.ga_measurement_id | tojson }});</script>
  {% endif %}
  <script type="application/ld+json">
  {{ [{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": site.brand,
    "alternateName": [site.name, site.short_name],
    "url": site.site_url ~ url()
  }, {
    "@context": "https://schema.org",
    "@type": ["MobileApplication", "VideoGame"],
    "name": site.brand,
    "alternateName": [site.name, site.short_name, "Football League soccer game"],
    "description": t.meta.home_description,
    "genre": ["Sports", "Soccer", "Football"],
    "gamePlatform": ["Android", "iOS"],
    "operatingSystem": "iOS, Android",
    "applicationCategory": "GameApplication",
    "playMode": ["SinglePlayer", "MultiPlayer"],
    "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
    "installUrl": [site.stores.google_play, site.stores.app_store],
    "publisher": {"@type": "Organization", "name": site.company},
    "image": site.site_url ~ site.base ~ "/og-image.jpg",
    "sameAs": site.social_urls,
    "url": site.site_url ~ url()
  }] | tojson }}
  </script>
</head>
<body class="page-{{ page_key }}">
  <a class="skip-link" href="#main">{{ t.nav.skip }}</a>
  {% include "partials/header.html" %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  {% include "partials/cookies.html" %}
  <script src="{{ asset('main.js') }}" defer></script>
</body>
</html>
